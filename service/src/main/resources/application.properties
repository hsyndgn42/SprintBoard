spring.application.name=sprintboard
sprintboard.auto-backup.enabled=${SPRINTBOARD_AUTO_BACKUP_ENABLED:true}
sprintboard.auto-backup.directory=${SPRINTBOARD_AUTO_BACKUP_DIRECTORY:./backups/scheduled}
sprintboard.auto-backup.retention-days=10
server.address=${SPRINTBOARD_BIND_ADDRESS:127.0.0.1}
server.port=${SPRINTBOARD_PORT:4181}
spring.datasource.url=jdbc:h2:file:${SPRINTBOARD_DB_PATH:./service/data/sprintboard};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.h2.console.enabled=false
spring.web.resources.cache.period=0
server.error.include-message=never
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.forward-headers-strategy=none
sprintboard.security.login.account-limit=5
sprintboard.security.login.source-limit=30
sprintboard.security.login.window-seconds=900
sprintboard.slack.team-id=${SPRINTBOARD_SLACK_TEAM_ID:}
sprintboard.slack.channel-id=${SPRINTBOARD_SLACK_CHANNEL_ID:}
sprintboard.slack.bot-token=${SPRINTBOARD_SLACK_BOT_TOKEN:}
sprintboard.slack.app-token=${SPRINTBOARD_SLACK_APP_TOKEN:}
sprintboard.slack.encryption-key=${SPRINTBOARD_SLACK_ENCRYPTION_KEY:}
sprintboard.slack.key-file=${SPRINTBOARD_SLACK_KEY_FILE:./service/data/slack-token.key}
